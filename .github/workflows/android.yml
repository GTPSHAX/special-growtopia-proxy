name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache

jobs:
  build-android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            preset: android-arm64
          - abi: armeabi-v7a
            preset: android-armeabi

    steps:
      - uses: actions/checkout@v4

      - name: Resolve NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      # vcpkg pinned to our manifest's builtin-baseline commit
      - name: Setup vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: df25fb4f73c1c3bf7d019fc50742fc90902f8c60
          path: vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-android-${{ matrix.abi }}-${{ hashFiles('vcpkg.json') }}

      - name: Create vcpkg binary cache dir
        run: mkdir -p vcpkg-bincache

      # NOTE: arm-android triplet is forbidden — NDK r26+ rejects NEON OFF.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: build/${{ matrix.preset }}/src/**/*.a
