name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            preset: windows-x64-msvc
          - arch: x86
            preset: windows-x86-msvc

    steps:
      - uses: actions/checkout@v4

      # vcpkg pinned to our manifest's builtin-baseline commit
      - name: Setup vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: df25fb4f73c1c3bf7d019fc50742fc90902f8c60
          path: vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-windows-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}

      - name: Create vcpkg binary cache dir
        run: New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: build/${{ matrix.preset }}/Release/**
