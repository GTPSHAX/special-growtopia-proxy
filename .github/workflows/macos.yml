name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache

jobs:
  build-macos:
    name: macOS arm64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install ninja

      # vcpkg pinned to our manifest's builtin-baseline commit
      - name: Setup vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: df25fb4f73c1c3bf7d019fc50742fc90902f8c60
          path: vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-macos-arm64-${{ hashFiles('vcpkg.json') }}

      - name: Create vcpkg binary cache dir
        run: mkdir -p vcpkg-bincache

      - name: Configure
        run: cmake --preset macos-arm64

      - name: Build
        run: cmake --build --preset macos-arm64 --parallel

      - name: Test
        run: ctest --preset macos-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/macos-arm64/**
